<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location de véhicules</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="rentalTimer" class="rental-timer hidden">
        <span>Location</span>
        <strong id="rentalTimerValue">00:00</strong>
    </div>

    <main id="app" class="hidden">
        <section class="rental-panel">
            <header class="panel-header">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 11L6.5 6.5C6.9 5.3 8 4.5 9.3 4.5H14.7C16 4.5 17.1 5.3 17.5 6.5L19 11H20C20.6 11 21 11.4 21 12V18C21 18.6 20.6 19 20 19H18.5C17.9 19 17.5 18.6 17.5 18V17H6.5V18C6.5 18.6 6.1 19 5.5 19H4C3.4 19 3 18.6 3 18V12C3 11.4 3.4 11 4 11H5ZM8.2 6.7L7.1 11H16.9L15.8 6.7C15.7 6.3 15.3 6 14.8 6H9.2C8.7 6 8.3 6.3 8.2 6.7ZM6.5 15C7.3 15 8 14.3 8 13.5S7.3 12 6.5 12 5 12.7 5 13.5 5.7 15 6.5 15ZM17.5 15C18.3 15 19 14.3 19 13.5S18.3 12 17.5 12 16 12.7 16 13.5 16.7 15 17.5 15Z"/>
                    </svg>
                </div>

                <div>
                    <h1>LOCATION DE VÉHICULES</h1>
                    <p>Choisissez le véhicule qui vous convient</p>
                </div>

                <div class="money-box">
                    <span>Votre argent</span>
                    <strong>$ 4,250</strong>
                </div>
            </header>

            <div class="duration-box">
                <span>Durée de location</span>
                <div id="durations" class="duration-list"></div>
            </div>

            <div id="vehicles" class="vehicle-list"></div>

            <footer class="panel-footer">
                <div class="info">
                    <span>i</span>
                    <p>Le paiement est calculé selon la durée choisie.<br>À la fin du compteur, le véhicule disparaît automatiquement.</p>
                </div>

                <button id="closeBtn" class="close-btn">
                    Fermer
                    <span>×</span>
                </button>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
