<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD complet</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        .hud-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            background: transparent;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <iframe id="hud-status" class="hud-layer" src="hud/index.html"></iframe>
    <iframe id="hud-clock" class="hud-layer" src="hudheure/index.html"></iframe>
    <iframe id="hud-speedo" class="hud-layer" src="speedo/index.html"></iframe>

    <script src="router.js"></script>
</body>
</html>
